<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lingo</title>
<style>body{font:16px system-ui;max-width:900px;margin:40px auto;padding:20px;background:#f4f7f4;color:#15231b}main{background:white;padding:24px;border-radius:20px;box-shadow:0 10px 35px #17382a18}h1{font-size:42px;margin:0 0 8px}p{color:#607066}section{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:25px}textarea,output{min-height:260px;padding:16px;border:1px solid #d6e1d9;border-radius:14px;font:18px/1.5 system-ui;resize:vertical}output{display:block;white-space:pre-wrap;color:#25352b;background:#fbfdfb}button{margin-top:14px;padding:12px 18px;border:0;border-radius:10px;background:#19724f;color:white;font-weight:700;cursor:pointer}@media(max-width:700px){section{grid-template-columns:1fr}h1{font-size:34px}}</style>
<main><h1>Lingo</h1><p>Escribe un párrafo y tradúcelo del español al inglés.</p><section><textarea id="q" placeholder="Escribe aquí..."></textarea><output id="out">La traducción aparecerá aquí.</output></section><button id="go">Traducir</button><p id="status"></p></main>
<script>go.onclick=async()=>{const text=q.value.trim();if(!text)return;go.disabled=true;status.textContent='Traduciendo...';try{const r=await fetch('/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,source:'es',target:'en'})});const d=await r.json();if(!r.ok)throw Error(d.error||'Error');out.textContent=d.translatedText;status.textContent='';}catch(e){out.textContent='';status.textContent='No se pudo traducir: '+e.message;}finally{go.disabled=false}};</script></html>
